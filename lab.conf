# SPDX-License-Identifier: GPL-2.0
#
# linux-kmods 实验台 recipe
#
# 这里只存“配方”（版本 / 来源 / 校验和 / 补丁），不存源码。
# 源码由 scripts/bootstrap.sh 按下面的 pin 还原到 external/，编译产物在 build/。
# 两个目录都不进 git，可随时删掉重建。

# ---- Linux 内核（vanilla，无代码补丁） ----
KERNEL_VERSION=4.9.263
KERNEL_SERIES=base
KERNEL_URL=https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.263.tar.xz
KERNEL_SHA256=9f7f2d2c6c686845d2c94f58101ff2cfd4453eaf1e7f0beb0d0f6b659e7f15b6

# ---- busybox（vanilla，只带 .config 和 rootfs overlay） ----
BUSYBOX_VERSION=1.33.1
BUSYBOX_URL=https://busybox.net/downloads/busybox-1.33.1.tar.bz2
BUSYBOX_SHA256=12cec6bd2b16d8a9446dd16130f2b92982f1819f6e1c5f5887b6db03f5660d28

# ---- QEMU（自研 virt 设备模型） ----
# base 是定制提交的父提交（v11.1.0-rc2 之后 9 个上游提交），不是 tag。
# 定制内容 = env/qemu/patches/ + env/qemu/series/<QEMU_SERIES>。
QEMU_URL=https://gitlab.com/qemu-project/qemu
QEMU_TAG=v11.1.0-rc2
QEMU_BASE=b428fe036233cbd15d37e3c027ab6ca4d3661a80
QEMU_SERIES=base
# 浅拉取：只下载基线 commit 需要的对象（约 210MB），不要 447MB 全历史。
# 置空则退化为普通全量 fetch。
QEMU_CLONE_FILTER=blob:none
QEMU_FALLBACK_DEPTH=200
